<html>
<meta name='viewport' content='height=device-height, width=device-width'> 
<head>
	<title>Web</title>
    <!-- Engine layer: pick the host (WPE/NPAPI vs LuneOS browser_shell) and, on the shell, supply the
         PalmSystem the framework expects. Both are no-ops on legacy webOS. Must precede enyo.js. -->
    <script src="source/engine/AtlasHost.js" type="text/javascript"></script>
    <script src="source/engine/ShellPalmSystem.js" type="text/javascript"></script>
    <!-- Phone or tablet chrome. Must precede enyo.js: it tags <html> before the first render, and it
         reads the platform's TabletUi flag through PalmSystem (shimmed just above on the shell). -->
    <script src="source/engine/AtlasFormFactor.js" type="text/javascript"></script>
    <script src="/usr/palm/frameworks/enyo/0.10/framework/enyo.js" type="text/javascript" launch="bridged"></script>
    <script src="/usr/palm/frameworks/enyo/1.0/framework/enyo.js" type="text/javascript"></script>
</head>
<body>
<script type="text/javascript">
	enyo.create({kind: "BrowserApp"}).renderInto(document.body);
</script>
</body>
</html>
